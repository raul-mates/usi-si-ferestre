<main class="homepage">
  <section class="homepage__image-and-text-container">
    <div class="homepage__hero-container">
      <h1 class="homepage__hero-container__header">Usi si ferestre de calitate<br>superioara pentru casa ta</h1>
      <p class="homepage__hero-container__text">Transforma spatiile din casa ta in locuri comfortabile si sigure, afla
        mai multe despre ofertele noastre</p>
      <input class="homepage__hero-container__button" routerLink="/products" type="button"
             value="Descopera serviciile noastre">
      <div class="homepage__hero-container__links-container">
        <p class="homepage__hero-container__links-container--link" routerLink="">experienta</p>
        <p class="homepage__hero-container__links-container--spacer">|</p>
        <p class="homepage__hero-container__links-container--link" routerLink="">profesionalism</p>
      </div>
    </div>
  </section>

  <section class="homepage__cards">
    <div class="homepage__header-cards-container">
      <h2 class="homepage__cards-header">Solutii complete pentru casa ta</h2>
      <div class="homepage__cards-container">
        @for (card of infoCards(); track card.id; let index = $index) {
          <app-small-card (onSelectedCard)="onSelectedCard($event)"
                          [cardId]="card.id"
                          [header]="card.header"
                          [iconName]="card.iconName"
                          [mainParagraph]="card.mainParagraph"
                          [selectedCard]="selectedCard()"
                          [smallFootnote]="card.smallFootnote">
          </app-small-card>
        }
      </div>
    </div>
  </section>
</main>
